app = "castleberry-bloom-seed"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8528
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8528

  [[services.ports]]
    port = 8528

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
