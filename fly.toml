# fly.toml app configuration file generated for castleberry-bloom on 2026-08-20T22:17:33-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'castleberry-bloom'
primary_region = 'sjc'

[build]
[http_service]
  internal_port = 8528
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
