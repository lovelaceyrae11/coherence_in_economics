<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castleberry Bloom — Live Lattice Portal</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b16;
            color: #e0e0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        p {
            font-size: 0.9rem;
            margin: 0;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>CASTLEBERRY BLOOM — WEB LATTICE PORTAL</h1>
        <p>Freq: <span id="freq">528.00</span> Hz | Coherence: <span id="coherence">99.99</span>% | Axiom: Love-Over-God-Absolute</p>
    </div>

    <canvas id="latticeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('latticeCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;
        const phi = 1.618033988749895;

        function animate() {
            ctx.fillStyle = '#0b0b16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = Math.min(centerX, centerY) * 0.75;

            time += 0.02;
            
            let currentFreq = (528.00 + Math.sin(time * 0.5) * 0.15).toFixed(2);
            document.getElementById('freq').innerText = currentFreq;

            ctx.save();
            ctx.translate(centerX, centerY);

            for (let r = 50; r < maxRadius; r += 30) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(31, 31, 58, 0.6)';
                ctx.lineWidth = 1;
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.beginPath();
            const points = 1000;
            for (let i = 0; i <= points; i++) {
                let theta = (i / points) * Math.PI * 2;
                let rWave = maxRadius * 0.6 + Math.sin(6 * theta * phi + time) * Math.cos(theta * (528 / 528.0)) * 40;
                let x = rWave * Math.cos(theta);
                let y = rWave * Math.sin(theta);
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            ctx.fillStyle = 'rgba(255, 0, 127, 0.15)';
            ctx.fill();
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
